<!DOCTYPE html>
<html lang="it">
<script src="segreto.js"></script>
<script src="dati.js"></script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Per te</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7b0d1;--ink:#6b0f2a;--red:#c4123f;--rose:#e8588f;--paper:#fff4f8;--blush:#fbd3e5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'Fraunces',Georgia,serif;line-height:1.55}
main{width:100%;max-width:460px;background:var(--paper);border:2px solid var(--red);border-radius:6px;padding:34px 22px 28px;text-align:center;box-shadow:8px 8px 0 var(--rose)}
h1{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;font-size:3rem;line-height:1.1;margin:0 0 10px;color:var(--red)}
.sub{margin:0 0 26px}
#code{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 20px;margin-bottom:18px}
.grp{display:flex;align-items:center;gap:6px}
.grp input{width:clamp(34px,11vw,44px);height:clamp(46px,14vw,56px);padding:0;text-align:center;font:600 1.6rem 'Fraunces',Georgia,serif;color:var(--ink);background:#fff;border:2px solid var(--rose);border-radius:8px;text-transform:uppercase}
.grp input:focus{outline:3px solid var(--red);outline-offset:1px;border-color:var(--red)}
.heart{font-size:1.7rem;margin-left:6px}
#err{min-height:1.5em;margin:0 0 12px;color:var(--red);font-style:italic}
button{font:inherit;cursor:pointer}
#go{background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 40px;font-size:1.1rem;font-weight:600}
#go:hover{background:var(--ink)}
#help{background:none;border:0;color:var(--red);text-decoration:underline;margin-top:20px;padding:6px}
#help:disabled{color:var(--ink);text-decoration:none;cursor:default;opacity:.7}
#hints{list-style:none;padding:0;margin:10px 0 0;text-align:left}
#hints li{background:var(--blush);border-left:5px solid var(--red);padding:10px 14px;margin-top:8px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<main>
  <h1 id="titolo"></h1>
  <p class="sub" id="sottotitolo"></p>
  <div id="code" role="group" aria-label="Codice segreto"></div>
  <p id="err" role="status"></p>
  <button id="go" type="button"></button>
  <div><button id="help" type="button"></button></div>
  <ul id="hints"></ul>
</main>

<script>
/* ====== MODIFICA QUI: testi e codice ====== */
const CONFIG = {
  titolo: "Ciao Vale",
  sottotitolo: "Ho nascosto un pensiero per te. Per aprirlo serve un codice segreto di 10 lettere.",
  bottone: "Apri",
  errore: "Quasi! Riprova 😄",
  aiuto: "Serve un aiuto? 💡",
  aiutoFinito: "Non ci sono altri indizi 😉",
  indizi: [
    "Il prodotto del quadrato e del cubo dei primi due numeri positivi interi",
    "Le iniziali di questi messaggi sono casuali ma in alcuni non lo sono",
    "App di messaggistica verde di meta"
  ]
};
/*====== FINE ZONA DA MODIFICARE ====== */

const $ = id => document.getElementById(id);
$('titolo').textContent = CONFIG.titolo;
$('sottotitolo').textContent = CONFIG.sottotitolo;
$('go').textContent = CONFIG.bottone;
$('help').textContent = CONFIG.aiuto;

// 10 caselle: gruppo da 6 + gruppo da 4 con cuore
const boxes = [], wrap = $('code');
[6, 4].forEach((n, gi, arr) => {
  const g = document.createElement('div'); g.className = 'grp';
  for (let i = 0; i < n; i++) {
    const el = document.createElement('input');
    el.maxLength = 1; el.autocomplete = 'off'; el.autocapitalize = 'characters';
    el.setAttribute('aria-label', 'Lettera ' + (boxes.length + 1));
    g.appendChild(el); boxes.push(el);
  }
  if (gi === arr.length - 1) {
    const h = document.createElement('span'); h.className = 'heart'; h.textContent = '❤️'; g.appendChild(h);
  }
  wrap.appendChild(g);
});

boxes.forEach((b, i) => {
  b.addEventListener('input', () => {
    b.value = b.value.replace(/[^a-z]/gi, '').toUpperCase().slice(-1);
    if (b.value && i < boxes.length - 1) boxes[i + 1].focus();
  });
  b.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !b.value && i > 0) { boxes[i - 1].focus(); boxes[i - 1].value = ''; }
    else if (e.key === 'ArrowLeft' && i > 0) boxes[i - 1].focus();
    else if (e.key === 'ArrowRight' && i < boxes.length - 1) boxes[i + 1].focus();
    else if (e.key === 'Enter') check();
  });
  b.addEventListener('paste', e => {
    e.preventDefault();
    const t = (e.clipboardData.getData('text') || '').replace(/[^a-z]/gi, '').toUpperCase();
    t.split('').slice(0, boxes.length - i).forEach((c, k) => boxes[i + k].value = c);
    boxes[Math.min(i + t.length, boxes.length - 1)].focus();
  });
  b.addEventListener('focus', () => b.select());
});

async function check() {
  const v = boxes.map(b => b.value).join('').toLowerCase();
  if (await SEGRETO.verificaCodice(v)) {
    try { sessionStorage.setItem('k', v); } catch (e) {}
    location.href = 'messaggio.html';
  } else {
    $('err').textContent = CONFIG.errore;
    wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
    boxes.forEach(b => b.value = ''); boxes[0].focus();
  }
}
$('go').addEventListener('click', check);

let shown = 0;
$('help').addEventListener('click', () => {
  if (shown < CONFIG.indizi.length) {
    const li = document.createElement('li'); li.textContent = CONFIG.indizi[shown++]; $('hints').appendChild(li);
  }
  if (shown >= CONFIG.indizi.length) { $('help').textContent = CONFIG.aiutoFinito; $('help').disabled = true; }
});
</script>
</body>
</html>
